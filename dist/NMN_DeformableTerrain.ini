EnableObjectStamps = 1

ObjectStampRadiusScale = 1.0

ObjectStampDepthScale = 1.0

; Whether a dropped object leaves a mark derived from its own mesh rather
; than from its collision hull.
;
; A hull is a capsule or a box, so every object of a given size stamped the
; same circle whatever it was shaped like.  The mesh carries the shape - the
; long axis of its own vertices, the width across it, and the thickness that
; decides how far it lies below its own centre line - so a helmet, a sword
; and a wheelbarrow leave three different marks, aimed the way the object
; actually points.  Reading a mesh costs one vertex walk per distinct mesh
; per session; everything after that is eight transformed corners.
;
; A mesh that cannot be read, or a node that turns out to hold the whole
; character rather than the object, falls back to the hull exactly as
; before, so setting this to 0 is a true escape hatch and not a partial
; one.  The log names a refused reading.
ObjectStampFromMesh = 1

; The range a mesh-derived mark's long half axis may fall in, in world
; units.  The floor is two clipmap texels (0.75 each), so a mark thinner
; than the grid it is drawn on cannot exist; the ceiling is four footprint
; half lengths (12.15 each), so no dropped object leaves a mark larger than
; the scene's own largest ordinary one.
ObjectStampMinRadius = 1.5
ObjectStampMaxRadius = 48.0
; Ceiling on how deep an object may sink, as a multiple of its own half
; thickness (its thinnest radial half width).  Measured in game: a fur helmet
; left a 13.4-unit dent while its own thickness was 4.1 and its width about
; 10, so the snow surface sank below the helmet and buried it.  2.0 keeps a
; dent at most twice the object thickness.  0 disables the cap.
ObjectStampMaxDepthPerThickness = 2.0
; Raise a dropped object so its own top sits at the snow surface.
; The raise moves the terrain mesh and the engine collision knows nothing
; about it, so without this an object falls through the blanket and stops
; on the bare terrain, buried whole.  Measured here: a steel arrow read
; drop = -35.9 against a 35-unit blanket.  0 disables the lift.
ObjectLiftToSnow = 1
; The least lift worth applying, in world units.  Below this the object is
; already where it belongs and the scan would only jitter it.
ObjectLiftSlack = 0.5

ObjectFullSizeRadius = 1.0

ObjectContactTolerance = 48.0

ObjectSinkLimit = 40.0

; An object lying on the ground under the snow reads a drop of minus the
; blanket's own thickness, which is SnowRaiseHeight - 35 units by default.
; The sink limit is therefore never allowed below that thickness, or the
; honest case - gear resting on the ground, buried as deep as the snow is
; - is refused and the object leaves no mark at all, which reads in game as
; having fallen through the world.  Set the value below higher than the
; blanket to allow a deeper object still.
ObjectSinkFollowsSnow = 1

; Extra depth allowed on top of the blanket when ObjectSinkFollowsSnow is
; on.  Raise this if a large object that sinks well into the snow leaves no
; mark.  LogObjectStamps names the exact shortfall, as
; "Object stamp: <name> REFUSED - below snow surface by <n>, limit <n>".
ObjectSinkSlack = 16.0

ObjectStampInterval = 0.2

; A spent arrow leaves a small hole, not a crater the length of the shaft: a
; shaft is judged by this radius instead of by its own collision bound, which
; spans the whole arrow.  Set ArrowStampRadius = 0 to let arrows leave no mark.
ArrowStampRadius = 4.0

ArrowStampDepthScale = 0.6

; --- the shape a carried weapon draws --------------------------------------
; A bow on the back and a rod in the hand are long thin shapes, and stamping
; both as the same small circle put the mark wherever the character happened to
; be rather than along the weapon.  With ShaftStampLine on the mark is drawn
; along the weapon's own axis, read out of the collision body's rotation, so a
; rod angled in the hand draws an angled line and a bow across the back draws a
; line across the back.
;
; The mark becomes a capsule: as long as the weapon, as wide as
; ShaftLineHalfWidth.  Set ShaftStampLine to 0 to go back to the small circle.
ShaftStampLine = 1

; How much of the weapon's measured length the line draws, 0 to 1.  A little
; under full because the extent is measured from the collision hull rather
; than the mesh and reads slightly long.
ShaftLineLengthScale = 0.85

; Half the width of the line, in world units.  This also sets how deep the mark
; is cut, so raising it makes the trail wider and deeper together.
ShaftLineHalfWidth = 1.1

; Cap on the drawn half length, so an unusually long weapon cannot lay a furrow
; across the whole clipmap.  40 units is two thirds of the 57.7-unit bow.
ShaftLineMaxLength = 40.0

; --- WHEN a carried weapon leaves a mark -----------------------------------
; A carried weapon rides the skeleton and swings with the gait, so unlike a
; foot it is usually not on the ground.  Measured over 1224 frames the bow's
; lowest point ranged 13.5 units below the ground to 12.4 above, and was above
; it on 919 of those frames - 75% of the time - while being stamped 41 times a
; second.  StampGroundClearance cannot catch that: half a unit is the right
; answer to "is this planted foot a hair off the ground".
;
; ShaftGroundClearance is the FLOOR of how far a weapon's lowest point may be
; above the SNOW and still mark.  The reach actually applied is
;
;     max( this value , the weapon's own half thickness )
;
; capped at ShaftStampMaxRadius, so a rod 4.9 thick is allowed 4.9 units off
; the surface and a thin arrow stays near this value.  3 units means the
; weapon has to be genuinely down.  Set to 0 to disable the check entirely.
;
; The measurement is taken against the snow, not the bare terrain under it.
; The snow is a layer stacked on the ground - SnowRaiseHeight is 35 units by
; default - and the rest of the plugin already measures objects against
; `land + SnowSurface::LiftAt(x, y)`.  A gate that asked only for the terrain
; therefore refused a weapon pressed into the snow but not yet through to the
; ground beneath it, and no value here would have helped.
ShaftGroundClearance = 3.0

; Put the mark at the weapon's lower end rather than at its bounding box
; centre.  The centre is rigid to the body, so walking, running and sprinting
; all marked the same place; the lower end moves with the stride.
ShaftStampAtContact = 1

; Half length of the mark once the weapon is known to be touching.  Drawing the
; whole weapon laid a bar every frame and the crossing bars read as a fan
; rather than a trail.  Set to 0 to draw the whole measured length.
ShaftContactLineLength = 12.0

; Whether a carried weapon's mark is placed from where the weapon *is*, rather
; than from the bound box it was measured in.
;
; The numbers this needs were already being read every frame and already move
; with the animation - ActorShapes measures them off the live hkpRigidBody
; transform - but Clipmap used only the bound centre, which is one point rigid
; to the body.  Every pose of the gait therefore marked the same place, which
; is the "walking, running and sprinting are all the same, so it feels wrong"
; this answers.  With this on, the mark is placed at the lower end of the
; measured long axis and turned to lie along it.
ShaftFollowPose = 1

; Whether the ground gate is taken at the same point the mark is placed.
;
; These must agree.  While ShaftStampAtContact placed the mark at the measured
; end but the gate still asked about the bound's bottom, a weapon could pass
; the gate and then stamp a point that was still in the air - two different
; heights for the same object.
ShaftGateAtContact = 1

; How the drawn mark's width is taken from the weapon's own measured
; thickness, instead of from one constant for every weapon.
;
; The extent walk reports a half thickness per object - the log gives the bow
; 4.90 against the 1.1 that was being drawn - so using it is what makes a bow,
; a rod and a shield leave marks of their own weight.  The scale is applied
; first, so one number widens or narrows every weapon at once.
ShaftLineWidthScale = 1.0

; Floor and ceiling of that width.  The floor matches the old constant so the
; two can be told apart at a glance in the log; the ceiling stops a collision
; hull that is deliberately oversized for gameplay from widening the trail.
ShaftLineMinWidth = 1.1
; --- ALIGN THE WEAPON'S MARK TO THE FOOTPRINT --------------------------------
;
; A footprint is not a circle-and-a-sliver: Clipmap's foot branch builds it as
; an ellipse whose half WIDTH is a fixed fraction of its own half LENGTH, so a
; footprint comes out about 2:1 with a raised band 24 world units wide.  The
; weapon branch derived its width from the object's THICKNESS instead, and a
; weapon is a rod - 4.9 units of thickness against 67.9 of length - so a bow's
; mark was up to 20:1 with a band 4 units across.
;
; That is what the screenshot showed.  A mark 80 units long and 4 wide, re-made
; every frame while the character walks, shifts a little each frame and cuts a
; fresh groove beside the last, so one pass leaves a rake of parallel teeth
; instead of one furrow.  The band had the mirror problem: it is a width, and a
; width read off a mark whose own units are stretched by the aspect comes out
; under the grid (0.75 units per texel) on the mark's two long sides.
;
; With this on, the mark's half width is taken from its half length the way a
; footprint's is, floored by the object's own thickness (a shield's face or a
; hammer's head still leaves a mark as wide as it is), and its length is capped
; at ShaftMarkMaxAspect times that width so it stays a furrow rather than
; becoming a rake.  Set ShaftMarkAlignToFoot = 0 to get the thickness-derived
; width and the uncapped length back.
ShaftMarkAlignToFoot = 1

; The fraction of the mark's half length that its half width takes, and the
; aspect its length is capped at.  0.50 mirrors [Snow]'s own footprint aspect,
; which is what makes the two marks the same width by construction rather than
; by coincidence.  4.0 leaves a long object a visibly longer mark than a foot
; while removing the ratios that stack into teeth; a footprint itself sits at
; 2.0, and 64 is effectively no cap.
ShaftMarkMaxAspect = 4.0

; ---------------------------------------------------------------------------
; THE MARK'S WIDTH IS A KNOB AGAIN, AND THE RIM EDGE IS NO LONGER SMOOTH
; ---------------------------------------------------------------------------
;
; WHY AN ALIGNED MARK CAME OUT AS A PLANK
;
; Aligning the mark to the footprint's shape takes the width from the mark's own
; length, so a long thin rod stops being drawn as a sliver.  On its own that is
; not enough: of 113 marks, 109 came out at exactly half length 24.00, half
; width 6.00.  Every frame stamped the same 4:1 ellipse, so walking laid a row
; of identical blocks with evenly spaced ridges between them.  The ridges were
; the outline rather than disturbed snow.
;
; The cause was one argument.  The footprint's own half width was computed with
; the width helper, which *clamps to its ceiling* - and the ceiling was passed
; as 0.0f in the belief that zero meant "no ceiling".  It does not; it means
; "return zero".  The footprint's width came back as zero, the alignment's
; ceiling fell back to the old six-unit constant, and every mark was cut to
; half the shape it was aligning to.  The helper now has a name of its own
; (FootprintHalfWidth, in ContactPoint.h) so this specific mistake cannot be
; made again, and the offline test walks the caller's real arguments rather than
; a hand-computed stand-in.
;
; WHAT CHANGED
;
; The width is now the mark's own length times ShaftMarkFootAspect, which makes
; that key the knob for this and makes a target reachable by arithmetic.  A
; carried weapon's mark is drawn at up to 24 half length, so:
;
;     half width 12.0  (a footprint's own width, "fully aligned")  -> 0.50
;     half width 8.4   (narrower, between the sliver and a foot)   -> 0.35
;     half width 7.2   (half a footprint)                          -> 0.30
;
; A footprint's own half width of 12.15 is now a ceiling rather than a floor on
; this key.  It was a floor before, which is why lowering the key did nothing
; above 0.506 - the floor was overriding it and the knob was dead.  It is still
; a floor for a mark longer than a whole footprint, where matching lengths and
; letting the width follow is the point of the alignment, and an object thicker
; than the resulting width keeps its own, so a shield's edge is not slimmed.
;
; HOW WIDE.  Half width as the mark's own length times FootAspect.
ShaftMarkFootAspect = 0.35

; How ragged the mark's rim edge is, as a fraction of the mark's own half width,
; and the wavelength of the noise that does it in world units.
;
; A rim's outer edge is an isocontour of the mark's distance field, so on its own
; it is exactly the mark's shape - a smooth ellipse.  That is fine for a
; footprint, whose oval is laid down one step at a time, but a carried weapon is
; re-stamped every frame at a walking stride, so a smooth ellipse lays its edge
; down in evenly spaced ridges.  This pushes the edge in and out, and varies the
; bank's width with it, so the rim reads as snow thrown aside rather than as an
; extrusion.  The noise is seeded from the world position, so overlapping stamps
; agree about where the edge is and the roughness does not crawl when the
; character stands still.
;
; Only line marks take it.  A footprint keeps the smooth oval it always had,
; which is the shape the weapon was aligned to in the first place.
;
; Band is the size of the crumbs: six units is the same field a footprint's own
; lip noise uses, so the two come out the same size.  Smaller reads as fine
; spatter, larger as a swollen lobed bank.
;
; Set Jitter to 0 to restore the smooth rim edge exactly.
ShaftMarkRimJitter = 0.35
ShaftMarkRimJitterBand = 6.0


ShaftLineMaxWidth = 6.0

; Whether the mark's length comes from how much of the weapon is under the snow.
;
; This is the last hand-picked number in the carried-weapon path.  The drawn
; length was ShaftContactLineLength, one value for every weapon and every pose,
; so a weapon driven twenty units under the surface and one that had barely
; broken it both drew the same bar.  With this on the weapon's own axis is
; walked and the land read under every step: the buried stretch between the two
; crossings decides the length, its middle is where the mark goes, and whether
; the weapon is touching at all stops being a clearance constant.
;
; This is also the strictest gate here.  A bow carried on the back or a sword
; held at guard is above the snow along its whole length, and drawing nothing
; is the correct answer for it - that is what "only mark it when it is really
; touching" means.  ShaftSpanMaxGap is the one knob that relaxes it.
;
; Set to 0 to restore the single-crossing placement.
ShaftSpanFromContact = 1

; How far above the snow a carried object may be and still leave a mark.
;
; When nothing is under the surface the closest the weapon's axis comes to the
; land is the gap, and this is the largest gap that still marks, with the mark
; placed at the point of closest approach.  Zero means strictly on contact; a
; large value restores the old "near enough" behaviour.  The log prints the
; measured gap, which is the number to set this from.  Deliberately below the
; twelve units the recorded bow's lowest point swung through, so a walking bow
; stops marking.
ShaftSpanMaxGap = 2.0

; How finely the axis is walked when looking for the buried stretch.  The two
; crossings are bisected afterwards, so this only sets how reliably a thin
; buried patch is found in the first place - sixteen steps over a 68-unit bow
; finds a patch wider than eight units.  Raise it for a weapon whose contact
; patch is short.
ShaftSpanSteps = 16

; Whether the buried-stretch walk is told how far the weapon's own lowest point
; hangs below the centre line it follows.
;
; The walk samples the weapon's centre line, and a line can only cross the snow
; where the line itself goes.  A bow carried on the back has its limbs hanging
; well below its middle, so the centre line can stay clear of the snow along its
; whole length while the weapon is visibly in it - the recorded case was a bow
; whose lowest point measured ten units under the snow, with no mark at all to
; show for it.
;
; Handing the walk that distance makes it ask the question the contact gate
; already asks, so the two stop disagreeing and the real crossings are found.
; Set to 0 to walk the centre line exactly as before.
ShaftLowOffset = 1

; How much longer than the buried stretch the trail is drawn.
;
; The walk measures only the part of the weapon strictly under the surface, and
; that is short in practice: across a full session with a carried bow the
; measured stretches ran 0.8 to 8.0 units on a 68-unit weapon, median 4.6.
; Drawn one to one those are stubs, which reads as a weapon that is visibly in
; the snow and leaves almost nothing behind.
;
; The measurement really is a lower bound rather than the footprint.  Only
; samples that ended up below the land height are counted, so a limb resting on
; the surface contributes nothing, and the sampling is discrete, so the two
; samples either side of a crossing are up to half a step apart.  A body pressed
; into snow disturbs a little of it either side of where it actually sinks.
;
; This is a scale rather than a fixed addition because the error grows with the
; stretch: a weapon barely dipped in touches over a short arc and one laid down
; touches over a long one, and the disturbed snow scales with each.  2.2 turns
; the recorded median into a 10-unit half length, a 20-unit trail on a 68-unit
; bow.  Set to 1.0 to draw exactly the measured stretch.
ShaftSpanLengthScale = 2.2

; The shortest half length worth drawing as a line rather than a disc.
;
; A line much shorter than it is wide reads as a dot with a direction, which is
; worse than the dot, so a short contact keeps the disc.  The comparison is
; against the weapon's own width and this value, whichever is larger - so a
; stout weapon needs a longer contact to be worth a line than a thin one does.
;
; This used to be compared against ShaftStampMaxRadius.  That is the ceiling the
; disc radius is clamped to - a number chosen for how fat a foot's mark may be -
; doing duty here as how short a furrow may be.  Nothing connects the two, and
; the cost was visible: a measured contact under four units drew a 4-unit
; circle, so the log's bow, with its limb a third of a unit under the snow, left
; a dot instead of a trail.
ShaftLineMinLength = 1.6

; Whether the mark is shaped from the weapon's own vertices instead of its hull.
;
; Everything above reads the collision hull: its centre line, its half thickness,
; its half length.  A hull is a capsule or a cylinder, so a bow becomes a straight
; bar and its arc is lost, a shield becomes a disc and its face is lost.  With
; this on the geometry under the same node is walked, the vertices are read from
; the CPU copy kept for skinning, the object's own long axis is found from its
; vertices, and the mark's width comes from how wide the mesh actually is along
; the buried stretch rather than from one thickness number shared by every pose.
;
; It also replaces the clearance estimate.  The hull route guesses that the
; surface is half a thickness from the centre line; a measured mesh has a lowest
; point of its own, so the gate compares that instead.
;
; Whether a mesh was measured is in the log, as is the layout it was read with
; and the error against the engine's own bound - a misread vertex stride shows up
; as a large error rather than as plausible-looking garbage.  When no mesh can be
; measured the hull route is used unchanged.
;
; Set to 0 to restore the hull-only behaviour.
StampFromMesh = 1




; A shaft - an arrow, a bolt, anything long and thin that registers as a
; projectile - reports its own origin at the nock, which is not where it met
; the ground.  Stamping the origin is what puts the hole behind the player
; while the arrow is in front.  The engine tells us the real contact point
; whenever a projectile hits something, and that answer is always used and
; costs nothing.  These two govern what happens when it did not:
;
;   ContactProbeShafts = 1   aim a short ray down the shaft and stamp where it
;                            stops (up to three rays, and only for shafts).
;                        = 0   stamp nothing.  A mark in the wrong place is
;                            worse than no mark, and this is the switch that
;                            makes that choice.
;
; ContactProbeMaxMiss rejects a probed landing that sits further from the
; shaft's own origin than this.  It is the guard against a ray slipping past
; the arrow and hitting the terrain underneath it, which would put a hole
; under a pier instead of on it.  0 disables the guard.
ContactProbeShafts = 1

ContactProbeMaxMiss = 96.0

; One line per shaft saying which answer placed the mark, how far it landed
; from the object, and how high the origin was above the ground.  A mark that
; is plainly on the snow and plainly not where the arrow is has to be
; readable from the log alone.  This is the switch to turn on when reporting
; a misplaced mark, because the log then carries the answer directly.
LogContactSamples = 0

; The mod's log.  Leave this at 1 while diagnosing anything: with it at 0
; the log keeps warnings but drops the per-event lines, and those lines are
; the only way to tell which answer put a mark where it is.
EnableLogging = 1

