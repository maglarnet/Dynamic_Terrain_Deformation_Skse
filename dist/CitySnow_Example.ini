; Copy to Data\SKSE\Plugins\NMN_DeformableTerrain\<YourMod>\CitySnow.ini - one folder per mod, any number of mods.
; In city worldspaces (Windhelm, Whiterun, Solitude, Markarth, Riften) only these meshes take prints:
; the land stays vanilla, and the plugin idles until a listed mesh is near. The open world is unchanged.
; Prints use the [SnowMeshes] profile in Surfaces.ini.
;
; Meshes= starts a list: one entry a line below it, up to the next key. Paths are relative to Meshes.
;   path.nif               its shapes whose diffuse matches MeshSnowTextures
;   path.nif:snow1         only the shape named snow1
;   path.nif:snow1|snow2   several named shapes
;   path.nif:*             every shape in it
; PressThrough holds for every list below it, up to the next PressThrough:
;   PressThrough = 1       the snow lies thin on stone or wood (a street): prints go through, the stone shows
;   PressThrough = 0       prints stop at what the feet stand on (drifts, piles)

PressThrough = 1
Meshes=
architecture\windhelm\whcenter.nif,
architecture\windhelm\whvalunstrad2.nif

PressThrough = 0
Meshes=
landscape\snowdrifts\snowdriftm01.nif:SnowDriftM01,
landscape\snowdrifts\snowdriftl01.nif:*
